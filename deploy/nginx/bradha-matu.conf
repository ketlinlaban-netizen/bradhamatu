# ── Nginx virtual host for Bradha Matu Console ──────────────────
#
# Serves the Laravel public/ directory on 127.0.0.1:8080.
# Cloudflare Tunnel forwards public traffic here.
#
# Install:
#   sudo cp deploy/nginx/bradha-matu.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/bradha-matu.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Adjust LARAVEL_ROOT to match your actual Laravel installation path.

server {
    listen 127.0.0.1:8080;
    server_name console.YOUR_DOMAIN;

    # ── Laravel document root ───────────────────────────────────
    # Only the public/ directory is ever exposed — never the
    # project root, .env, or storage/ directory.
    root /opt/bradha-matu-api/public;
    index index.php index.html;

    # ── Security headers ────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ── Prevent access to sensitive files ───────────────────────
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* \.(env|sql|md|lock|log|yml|yaml)$ {
        deny all;
    }

    # ── API routes → PHP ────────────────────────────────────────
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── SPA frontend (built React assets) ───────────────────────
    # If the frontend is built into Laravel's public/ directory,
    # these are served directly. For dev mode with a separate Vite
    # server, proxy / to the Vite dev server instead.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ─────────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # Only allow PHP execution in the public directory
        internal;
    }

    # ── Static asset caching ────────────────────────────────────
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Health check endpoint (no auth, no sensitive data) ──────
    location = /api/health {
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    # ── Disable unwanted HTTP methods ───────────────────────────
    if ($request_method !~ ^(GET|POST|HEAD|OPTIONS)$ ) {
        return 405;
    }

    access_log /var/log/nginx/bradha-matu-access.log;
    error_log  /var/log/nginx/bradha-matu-error.log;
}
